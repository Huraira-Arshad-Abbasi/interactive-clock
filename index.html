<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clock</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <div class="container">
        <div class="img">
            <img width="100%" src="hd-wallpaper-g7506c81cd_1920.jpg" alt="" srcset="">
            <h2>03 : 25 : 39 PM</h2>
        </div>
        <div class="buttons">
            <button id="1" type="button"><span class="material-symbols-outlined">
                    sunny_snowing
                </span></button>
            <button id="2" type="button">
                <span class="material-symbols-outlined">
                    partly_cloudy_day
                    </span>
            </button>
            <button id="3" type="button">
                <span class="material-symbols-outlined">
                    beach_access
                    </span>
            </button>
            <button id="4" type="button">
                <span class="material-symbols-outlined">
                    clear_day
                    </span>
            </button>
        </div>
    </div>
</body>
<script>
    
    setInterval(() => {
       document.querySelector("h2").innerText = new Date().toLocaleTimeString();
   }, 1000);
   document.querySelector(`.buttons`).addEventListener(`click`, (e) => {
    let target = e.target.innerText
    let img = document.querySelector('img')
       if (target === 'sunny_snowing') {
        img.src='hong-kong.jpg'
    } else if (target === 'partly_cloudy_day') {
        img.src='car-780.jpg'
    } else if (target === 'beach_access') {
        img.src='hd-wallpaper-3408119_1920.jpg'
    }else {
        img.src='road.jpg'
    }
   });
</script>
</html>
